name: Rust Tests
on:
  pull_request:
  push:
    branches:
      - master
jobs:
  test:
    name: Test and Lint
    runs-on: docker
    container:
      image: nixos/nix:2.22.1
    steps:
      - name: Install Node.js for Actions
        run: |
          nix-channel --update
          nix-env -iA nixpkgs.nodejs

      - name: Checkout code
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Enable flakes
        run: |
          mkdir -p /etc/nix
          echo "experimental-features = nix-command flakes" >> /etc/nix/nix.conf

      - name: Run tests
        run: nix-shell -A shell-ci --run "cargo test"

      - name: Check formatting
        run: nix-shell -A shell-ci --run "cargo fmt -- --check"

      - name: Clippy
        run: nix-shell -A shell-ci --run "cargo clippy --all-targets -- -D warnings"

      - name: Security audit
        run: nix-shell -A shell-ci --run "cargo audit"

      - name: Dependency check
        run: nix-shell -A shell-ci --run "cargo deny check"
